name: Build Xiaomi RA80 U-Boot

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-ra80.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            libncurses5-dev \
            gawk \
            git \
            gettext \
            libssl-dev \
            python3 \
            wget \
            cpio \
            flex \
            bison \
            bc \
            rsync \
            zopfli \
            device-tree-compiler

          sudo npm install -g \
            html-minifier-terser \
            clean-css \
            terser \
            svgo

      - name: Clone U-Boot source
        run: |
          git clone --depth=1 \
            https://github.com/1980490718/u-boot-2016.git \
            u-boot-2016

      - name: Clone Qualcomm ARM toolchain
        run: |
          git clone --depth=1 \
            https://github.com/1980490718/toolchain-arm_cortex-a7_gcc-5.2.0.git \
            staging_dir

      - name: Add Xiaomi RA80 target
        working-directory: u-boot-2016
        shell: bash
        run: |
          set -eux

          #
          # 1. Defconfig
          #
          cp \
            configs/ipq5018_pz_l8_defconfig \
            configs/ipq5018_xiaomi_ra80_defconfig

          sed -i \
            's/CONFIG_IPQ5018_PZ_L8=y/CONFIG_IPQ5018_XIAOMI_RA80=y/' \
            configs/ipq5018_xiaomi_ra80_defconfig

          sed -i \
            's/CONFIG_BOARD_DISPLAY_NAME="CMCC PZ-L8"/CONFIG_BOARD_DISPLAY_NAME="Xiaomi AX3000 RA80 V1"/' \
            configs/ipq5018_xiaomi_ra80_defconfig

          #
          # 2. Kconfig
          #
          python3 <<'PY'
          from pathlib import Path

          p = Path("board/ipq5018/Kconfig")
          s = p.read_text()

          addition = r'''
          config IPQ5018_XIAOMI_RA80
              bool "For Xiaomi AX3000 RA80 V1 support"
              select 256MB_RAM
              default n
              help
                  Enable support for Xiaomi AX3000 RA80 V1

          '''

          pos = s.rfind("\nendif")
          if pos < 0:
              raise SystemExit("Cannot find final endif in board/ipq5018/Kconfig")

          s = s[:pos] + "\n" + addition + s[pos:]
          p.write_text(s)
          PY

          #
          # 3. DTS Makefile
          #
          python3 <<'PY'
          from pathlib import Path

          p = Path("arch/arm/dts/Makefile")
          s = p.read_text()

          needle = '''else ifeq ($(CONFIG_IPQ5018_PZ_L8),y)
          dtb-$(CONFIG_ARCH_IPQ5018) += ipq5018-pz-l8.dtb
          '''

          replacement = '''else ifeq ($(CONFIG_IPQ5018_XIAOMI_RA80),y)
          dtb-$(CONFIG_ARCH_IPQ5018) += ipq5018-xiaomi-ra80.dtb
          else ifeq ($(CONFIG_IPQ5018_PZ_L8),y)
          dtb-$(CONFIG_ARCH_IPQ5018) += ipq5018-pz-l8.dtb
          '''

          if needle not in s:
              raise SystemExit("Cannot find IPQ5018_PZ_L8 block")

          p.write_text(s.replace(needle, replacement, 1))
          PY

          #
          # 4. RA80 DTS
          #
          cat > arch/arm/dts/ipq5018-xiaomi-ra80.dts <<'EOF'
          /dts-v1/;
          #include "ipq5018-soc.dtsi"

          / {
              model = "Xiaomi AX3000 RA80 V1";
              compatible = "qca,ipq5018", "qca,ipq5018-mp02.1";

              machid = <0x8040000>;
              config_name = "config@mp02.1", "config-mp02.1";

              aliases {
                  console = "/serial@78AF000";
                  nand = "/nand-controller@79B0000";

                  power_led = "/tlmm-gpio/led_gpio/system-yellow";
                  blink_led = "/tlmm-gpio/led_gpio/network-yellow";
                  system_led = "/tlmm-gpio/led_gpio/system-blue";

                  reset_key = "/tlmm-gpio/key_gpio/reset";
              };

              console: serial@78AF000 {
                  status = "ok";

                  serial_gpio {
                      blsp0_mux_uart_rx {
                          gpio = <20>;
                          func = <0>;
                          pull = <GPIO_PULL_DOWN>;
                          drvstr = <GPIO_8MA>;
                          od_en = <GPIO_OD_DISABLE>;
                      };

                      blsp0_mux_uart_tx {
                          gpio = <21>;
                          func = <0>;
                          pull = <GPIO_PULL_DOWN>;
                          drvstr = <GPIO_8MA>;
                          od_en = <GPIO_OD_DISABLE>;
                      };

                      blsp0_uart_rx {
                          gpio = <28>;
                          func = <3>;
                          pull = <GPIO_NO_PULL>;
                          drvstr = <GPIO_8MA>;
                          od_en = <GPIO_OD_DISABLE>;
                      };

                      blsp0_uart_tx {
                          gpio = <29>;
                          func = <3>;
                          pull = <GPIO_NO_PULL>;
                          drvstr = <GPIO_8MA>;
                          od_en = <GPIO_OD_DISABLE>;
                      };
                  };
              };

              nand: nand-controller@79B0000 {
                  status = "okay";

                  nand_gpio {
                      qspi_dat3 {
                          gpio = <4>;
                          func = <2>;
                          pull = <GPIO_NO_PULL>;
                          od_en = <GPIO_OD_DISABLE>;
                          drvstr = <GPIO_8MA>;
                      };

                      qspi_dat2 {
                          gpio = <5>;
                          func = <2>;
                          pull = <GPIO_NO_PULL>;
                          od_en = <GPIO_OD_DISABLE>;
                          drvstr = <GPIO_8MA>;
                      };

                      qspi_dat1 {
                          gpio = <6>;
                          func = <2>;
                          pull = <GPIO_NO_PULL>;
                          od_en = <GPIO_OD_DISABLE>;
                          drvstr = <GPIO_8MA>;
                      };

                      qspi_dat0 {
                          gpio = <7>;
                          func = <2>;
                          pull = <GPIO_NO_PULL>;
                          od_en = <GPIO_OD_DISABLE>;
                          drvstr = <GPIO_8MA>;
                      };

                      qspi_cs_n {
                          gpio = <8>;
                          func = <2>;
                          od_en = <GPIO_OD_DISABLE>;
                          drvstr = <GPIO_8MA>;
                      };

                      qspi_clk {
                          gpio = <9>;
                          func = <2>;
                          od_en = <GPIO_OD_DISABLE>;
                          drvstr = <GPIO_8MA>;
                      };
                  };
              };

              gmac_cfg {
                  ext_mdio_gpio = <36 37>;
                  gephy_led = <30>;

                  gmac1_cfg {
                      unit = <0>;
                      base = <0x39C00000>;
                      phy_address = <7>;
                      phy_external_link = <0>;
                  };

                  gmac2_cfg {
                      unit = <1>;
                      base = <0x39D00000>;

                      mac_pwr = <0xaa545>;

                      s17c_switch_enable = <1>;
                      switch_port_count = <5>;
                      switch_phy_address = <0 1 2 3 4>;
                      switch_gpio = <26>;
                  };
              };

              tlmm-gpio {
                  led_gpio {
                      system-yellow {
                          gpio = <17>;
                          func = <0>;
                          out = <GPIO_OUT_LOW>;
                          drvstr = <GPIO_8MA>;
                          pull = <GPIO_PULL_DOWN>;
                          oe = <GPIO_OE_ENABLE>;
                      };

                      system-blue {
                          gpio = <19>;
                          func = <0>;
                          out = <GPIO_OUT_LOW>;
                          drvstr = <GPIO_8MA>;
                          pull = <GPIO_PULL_DOWN>;
                          oe = <GPIO_OE_ENABLE>;
                      };

                      network-yellow {
                          gpio = <20>;
                          func = <0>;
                          out = <GPIO_OUT_LOW>;
                          drvstr = <GPIO_8MA>;
                          pull = <GPIO_PULL_DOWN>;
                          oe = <GPIO_OE_ENABLE>;
                      };

                      network-blue {
                          gpio = <22>;
                          func = <0>;
                          out = <GPIO_OUT_LOW>;
                          drvstr = <GPIO_8MA>;
                          pull = <GPIO_PULL_DOWN>;
                          oe = <GPIO_OE_ENABLE>;
                      };
                  };

                  key_gpio {
                      reset {
                          gpio = <25>;
                          func = <0>;
                          drvstr = <GPIO_8MA>;
                          pull = <GPIO_PULL_UP>;
                          oe = <GPIO_OE_DISABLE>;
                      };

                      mesh {
                          gpio = <23>;
                          func = <0>;
                          drvstr = <GPIO_8MA>;
                          pull = <GPIO_PULL_UP>;
                          oe = <GPIO_OE_DISABLE>;
                      };
                  };
              };
          };
          EOF

          echo "===== RA80 defconfig ====="
          grep -E 'RA80|IPQ5018_XIAOMI' \
            configs/ipq5018_xiaomi_ra80_defconfig

          echo "===== RA80 DTS ====="
          grep -E 'model|machid|gephy_led|switch_port_count|switch_gpio' \
            arch/arm/dts/ipq5018-xiaomi-ra80.dts

      - name: Build RA80 U-Boot
        working-directory: u-boot-2016
        shell: bash
        run: |
          set -eux
          chmod +x build.sh
          ./build.sh ipq5018_xiaomi_ra80

      - name: Inspect output
        working-directory: u-boot-2016
        shell: bash
        run: |
          set -eux

          FILE="bin/openwrt-ipq5018_xiaomi_ra80-u-boot.mbn"

          test -f "$FILE"

          ls -lh "$FILE"
          sha256sum "$FILE"

          echo
          echo "===== strings ====="
          strings "$FILE" | grep -Ei \
            'Xiaomi|RA80|IPQ5018|MP02' || true

          echo
          echo "===== all bin files ====="
          ls -lah bin/

      - name: Upload RA80 U-Boot
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Xiaomi-AX3000-RA80-V1-U-Boot
          path: u-boot-2016/bin/openwrt-ipq5018_xiaomi_ra80-u-boot.mbn
          retention-days: 30
