name: Build Xiaomi AX3000 RA80 V1 U-Boot

on:
  push:
    branches:
      - xiaomi-ra80
  workflow_dispatch:

jobs:
  build-ra80:
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: "24"
      TOOLCHAIN: "https://github.com/1980490718/toolchain-arm_cortex-a7_gcc-5.2.0.git"
      DEPENDENCIES: "build-essential libncurses5-dev gawk git gettext libssl-dev python3 wget cpio flex bison bc rsync zopfli device-tree-compiler"

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ${{ env.DEPENDENCIES }}
          sudo npm install -g html-minifier-terser clean-css terser svgo

      - name: Clone ARM toolchain
        run: |
          git clone --depth=1 ${{ env.TOOLCHAIN }} ../staging_dir
          test -x ../staging_dir/toolchain-arm_cortex-a7_gcc-5.2.0_musl-1.1.16_eabi/bin/arm-openwrt-linux-gcc

      - name: Build RA80 U-Boot
        run: |
          chmod +x build.sh
          ./build.sh ipq5018_xiaomi_ra80

      - name: Inspect image
        run: |
          FILE=bin/openwrt-ipq5018_xiaomi_ra80-u-boot.mbn
          test -f "$FILE"
          ls -lh "$FILE"
          sha256sum "$FILE"
          echo "---- identity strings ----"
          strings "$FILE" | grep -Ei 'Xiaomi|RA80|IPQ5018|MP02' || true
          echo "---- ELF/MBN headers ----"
          file "$FILE" || true
          xxd -l 256 "$FILE"

      - name: Upload RA80 image
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Xiaomi-AX3000-RA80-V1-U-Boot
          path: bin/openwrt-ipq5018_xiaomi_ra80-u-boot.mbn
          retention-days: 30
