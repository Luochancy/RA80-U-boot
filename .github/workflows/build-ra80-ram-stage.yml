name: Build RA80 RAM-only full handoff test

on:
  workflow_dispatch:
  push:
    branches:
      - xiaomi-ra80

concurrency:
  group: ra80-ram-stage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      TOOLCHAIN: https://github.com/1980490718/toolchain-arm_cortex-a7_gcc-5.2.0.git
      SDK_URL: https://github.com/hzyitc/openwrt-redmi-ax3000/releases/download/ci-ipq50xx-qsdk-kernel-4.4-openwrt-21.02-qsdk-11.4.0.5.7418-20240727-173443-UTC/openwrt-sdk-ipq50xx-arm_gcc-5.5.0_musl_eabi.Linux-x86_64.tar.xz
      SDK_SHA256: 9d76ebd0d3dd02c2a6568d0f429acbbba1175f21b9a37dbb1b6f0be144919df3

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext libssl-dev python3 wget curl xz-utils cpio flex bison bc rsync zopfli device-tree-compiler nodejs npm file binutils
          sudo npm install -g html-minifier-terser clean-css terser svgo

      - name: Build matching RA80 U-Boot payload
        run: |
          set -euxo pipefail
          git clone --depth=1 "$TOOLCHAIN" ../staging_dir
          test -x ../staging_dir/toolchain-arm_cortex-a7_gcc-5.2.0_musl-1.1.16_eabi/bin/arm-openwrt-linux-gcc
          chmod +x build.sh
          ./build.sh ipq5018_xiaomi_ra80
          test -s u-boot
          test -s u-boot.bin

          test -s u-boot.map
          mkdir -p diagnostics
          cp u-boot.map diagnostics/
          cp .config diagnostics/uboot.config
          python3 tools/ra80-kmod/test_eth_reset.py | tee diagnostics/ethernet-regression.txt
          ../staging_dir/toolchain-arm_cortex-a7_gcc-5.2.0_musl-1.1.16_eabi/bin/arm-openwrt-linux-nm -S --size-sort u-boot > diagnostics/symbol-sizes.txt
          python3 tools/ra80-kmod/verify_bootstages.py u-boot.bin u-boot.map | tee diagnostics/bootstage-verification.txt
          # The final ELF is stripped; use the symbol address from its link map.
          MAGIC_ADDRESS="$(awk '$NF == "ra80_ramboot_magic" { print $(NF - 1); exit }' u-boot.map)"
          test -n "$MAGIC_ADDRESS"
          printf '%s\n' "$MAGIC_ADDRESS" | tee /tmp/ra80-magic-address.txt

      - name: Download matching stock-kernel SDK
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 2 "$SDK_URL" -o /tmp/sdk.tar.xz
          echo "$SDK_SHA256  /tmp/sdk.tar.xz" | sha256sum -c -
          mkdir -p /tmp/sdk
          tar -xJf /tmp/sdk.tar.xz -C /tmp/sdk --strip-components=1

      - name: Install generated-payload module packages
        run: |
          set -euxo pipefail
          PAYLOAD="$GITHUB_WORKSPACE/u-boot.bin"
          MAGIC_ADDRESS="$(cat /tmp/ra80-magic-address.txt)"
          python3 tools/ra80-kmod/bin2c.py "$PAYLOAD" /tmp/ra80_payload.inc \
            --source-commit "$GITHUB_SHA" \
            --ramboot-magic-address "$MAGIC_ADDRESS" | tee /tmp/payload-info.txt

          mkdir -p /tmp/sdk/package/ra80-stage-ethdiag/src
          cp /tmp/ra80_payload.inc /tmp/sdk/package/ra80-stage-ethdiag/src/
          cp tools/ra80-kmod/OpenWrt.Stage.Makefile /tmp/sdk/package/ra80-stage-ethdiag/Makefile
          cp tools/ra80-kmod/ra80_stage_ethdiag.c /tmp/sdk/package/ra80-stage-ethdiag/src/
          cp tools/ra80-kmod/Stage.Kbuild /tmp/sdk/package/ra80-stage-ethdiag/src/Makefile

          mkdir -p /tmp/sdk/package/ra80-ramboot-full/src
          cp /tmp/ra80_payload.inc /tmp/sdk/package/ra80-ramboot-full/src/
          cp tools/ra80-kmod/OpenWrt.FullRamboot.Makefile /tmp/sdk/package/ra80-ramboot-full/Makefile
          cp tools/ra80-kmod/ra80_ramboot_full.c /tmp/sdk/package/ra80-ramboot-full/src/
          cp tools/ra80-kmod/FullRamboot.Kbuild /tmp/sdk/package/ra80-ramboot-full/src/Makefile

      - name: Build modules with QSDK 11.4 GCC 5.5 kernel ABI
        run: |
          set -euxo pipefail
          cd /tmp/sdk
          make defconfig
          make package/ra80-stage-ethdiag/compile package/ra80-ramboot-full/compile V=s -j2

      - name: Collect and statically verify artifacts
        run: |
          set -euxo pipefail
          STAGE_KO="$(find /tmp/sdk/build_dir -type f -name ra80_stage_ethdiag.ko -print -quit)"
          FULL_KO="$(find /tmp/sdk/build_dir -type f -name ra80_ramboot_full.ko -print -quit)"
          test -n "$STAGE_KO"
          test -s "$STAGE_KO"
          test -n "$FULL_KO"
          test -s "$FULL_KO"

          KERNEL_TREE="$(find /tmp/sdk/build_dir -type d -path '*/linux-ipq50xx_arm/linux-4.4-qsdk-11.4.0.5' -print -quit)"
          test -n "$KERNEL_TREE"
          grep -Fx '#define UTS_RELEASE "4.4.60"' "$KERNEL_TREE/include/generated/utsrelease.h"

          mkdir -p out
          cp diagnostics/bootstage-verification.txt out/
          cp diagnostics/ethernet-regression.txt out/
          cp diagnostics/symbol-sizes.txt out/
          cp u-boot.map out/
          cp .config out/uboot.config
          cp tools/ra80-kmod/RA80-SOURCE-REVIEW.md out/
          cp tools/ra80-kmod/verify_bootstages.py out/
          cp "$STAGE_KO" out/ra80_stage_ethdiag.ko
          cp "$FULL_KO" out/ra80_ramboot_full.ko
          cp u-boot.bin out/openwrt-ipq5018_xiaomi_ra80-u-boot-leddiag.bin
          cp tools/ra80-kmod/RA80-RAM-STAGE-TESTING.md out/README.md
          md5sum out/ra80_ramboot_full.ko out/ra80_stage_ethdiag.ko > out/MD5SUMS
          sha256sum out/ra80_ramboot_full.ko out/ra80_stage_ethdiag.ko out/openwrt-ipq5018_xiaomi_ra80-u-boot-leddiag.bin > out/SHA256SUMS

          for MODULE in "$STAGE_KO" "$FULL_KO"; do
            LABEL="$(basename "$MODULE")"
            readelf -rW "$MODULE" > "/tmp/${LABEL}.relocations.txt"
            readelf -SW "$MODULE" > "/tmp/${LABEL}.sections.txt"
            readelf -sW "$MODULE" > "/tmp/${LABEL}.symbols.txt"
            strings "$MODULE" > "/tmp/${LABEL}.strings.txt"
            if grep -qw R_ARM_REL32 "/tmp/${LABEL}.relocations.txt"; then
              echo "fatal: unsupported R_ARM_REL32 relocation remains in $LABEL" >&2
              exit 1
            fi
            grep -F '.core.plt' "/tmp/${LABEL}.sections.txt"
            grep -F '.init.plt' "/tmp/${LABEL}.sections.txt"
            grep -Eq 'GCC: .*5\.5\.0' "/tmp/${LABEL}.strings.txt"
            if grep ' UND ' "/tmp/${LABEL}.symbols.txt" | grep -Eiq '(mtd|nand|ubi|flash|erase|_soft_restart|smp_send_stop)'; then
              echo "fatal: forbidden direct flash or handoff import in $LABEL" >&2
              grep ' UND ' "/tmp/${LABEL}.symbols.txt" | grep -Ei '(mtd|nand|ubi|flash|erase|_soft_restart|smp_send_stop)' >&2
              exit 1
            fi
          done

          grep -F 'RAM ONLY; NO NAND/MTD/APPSBL writes' /tmp/ra80_ramboot_full.ko.strings.txt
          grep -F 'STAGE VERIFIED AND ARMED' /tmp/ra80_ramboot_full.ko.strings.txt
          grep -F 'HANDOFF NOW' /tmp/ra80_ramboot_full.ko.strings.txt
          grep -F 'RAM-only marker accepted; auto-starting Webfailsafe' u-boot.bin

          VERMAGIC="$(sed -n 's/^vermagic=//p' /tmp/ra80_stage_ethdiag.ko.strings.txt | head -n 1)"
          if [[ -n "$VERMAGIC" && "$VERMAGIC" != 4.4.60* ]]; then
            echo "fatal: unexpected module vermagic: $VERMAGIC" >&2
            exit 1
          fi

          {
            echo "Source commit: $GITHUB_SHA"
            echo "Module toolchain: QSDK 11.4.0.5.7418 / Linux 4.4 / GCC 5.5.0"
            echo "U-Boot toolchain: OpenWrt GCC 5.2.0"
            echo "Kernel release gate: $(cat "$KERNEL_TREE/include/generated/utsrelease.h")"
            echo "Module vermagic: ${VERMAGIC:-not emitted by this QSDK Kbuild}"
            echo "Module compiler: $(grep -E 'GCC: .*5\.5\.0' /tmp/ra80_ramboot_full.ko.strings.txt | head -n 1)"
            echo
            cat /tmp/payload-info.txt
            echo
            sha256sum out/ra80_stage_ethdiag.ko out/ra80_ramboot_full.ko out/openwrt-ipq5018_xiaomi_ra80-u-boot-leddiag.bin
            echo
            file out/ra80_stage_ethdiag.ko out/ra80_ramboot_full.ko out/openwrt-ipq5018_xiaomi_ra80-u-boot-leddiag.bin
            echo
            echo '--- full module metadata ---'
            strings "$FULL_KO" | grep -E '^(vermagic|depends|license|description|author|version|parm)=' || true
            echo
            echo '--- full module sections ---'
            cat /tmp/ra80_ramboot_full.ko.sections.txt
            echo
            echo '--- full module relocations ---'
            cat /tmp/ra80_ramboot_full.ko.relocations.txt
            echo
            echo '--- full module undefined imports ---'
            grep ' UND ' /tmp/ra80_ramboot_full.ko.symbols.txt || true
          } | tee out/inspection.txt

      - name: Preserve layout evidence if verification fails
        if: failure() && hashFiles('diagnostics/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: RA80-layout-diagnostics-no-modules
          path: diagnostics/
          retention-days: 30

      - name: Upload verified RAM-only full test bundle
        uses: actions/upload-artifact@v4
        with:
          name: RA80-RAM-only-network-no-NAND
          path: out/
          if-no-files-found: error
          retention-days: 30
